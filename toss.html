<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Toss - ScoreLK</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .toss-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .toss-container h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .team-inputs {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .toss-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .toss-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .toss-btn:active {
            transform: translateY(0);
        }

        .toss-result {
            margin: 30px 0;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            min-height: 100px;
            display: none;
        }

        .toss-result.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .toss-result h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .toss-result p {
            color: #333;
            font-size: 1.1em;
        }

        .coin-animation {
            font-size: 4em;
            margin: 20px 0;
            animation: flip 1s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(1800deg); }
        }

        .action-buttons {
            margin-top: 20px;
        }

        .btn-start-match {
            background: #4CAF50;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-start-match:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="toss-container">
        <h1>🏏 Cricket Toss</h1>
        
        <div class="team-inputs">
            <div class="input-group">
                <label for="teamAInput">Team A Name:</label>
                <input type="text" id="teamAInput" placeholder="Enter Team A name" value="Team A">
            </div>
            
            <div class="input-group">
                <label for="teamBInput">Team B Name:</label>
                <input type="text" id="teamBInput" placeholder="Enter Team B name" value="Team B">
            </div>
        </div>

        <button class="toss-btn" id="tossBtn">🪙 Toss Coin</button>

        <div class="toss-result" id="tossResult">
            <div class="coin-animation" id="coinAnimation">🪙</div>
            <h2 id="winnerText"></h2>
            <p id="resultText"></p>
        </div>

        <div class="action-buttons">
            <a href="index.html" class="btn-start-match" id="startMatchBtn">Start Match ▶</a>
        </div>
    </div>

    <script>
        const teamAInput = document.getElementById('teamAInput');
        const teamBInput = document.getElementById('teamBInput');
        const tossBtn = document.getElementById('tossBtn');
        const tossResult = document.getElementById('tossResult');
        const winnerText = document.getElementById('winnerText');
        const resultText = document.getElementById('resultText');
        const coinAnimation = document.getElementById('coinAnimation');

        // Load saved team names
        teamAInput.value = localStorage.getItem('teamAName') || 'Team A';
        teamBInput.value = localStorage.getItem('teamBName') || 'Team B';

        tossBtn.addEventListener('click', () => {
            // Save team names
            const teamA = teamAInput.value.trim() || 'Team A';
            const teamB = teamBInput.value.trim() || 'Team B';
            
            localStorage.setItem('teamAName', teamA);
            localStorage.setItem('teamBName', teamB);

            // Hide result during animation
            tossResult.classList.remove('show');
            
            // Random toss
            setTimeout(() => {
                const winner = Math.random() < 0.5 ? teamA : teamB;
                const choice = Math.random() < 0.5 ? 'bat' : 'bowl';
                
                winnerText.textContent = `${winner} won the toss!`;
                resultText.textContent = `${winner} chose to ${choice} first.`;
                
                // Show result with animation
                coinAnimation.style.animation = 'none';
                setTimeout(() => {
                    coinAnimation.style.animation = 'flip 1s ease-in-out';
                    tossResult.classList.add('show');
                }, 10);
            }, 100);
        });
    </script>
</body>
</html>
